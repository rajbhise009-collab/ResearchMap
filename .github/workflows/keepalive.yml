name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity. Weekly growth commits on every live run, but a paused or quiet
# stretch could pass 60 days. This checks once a week and, only if main has
# had no commit for 40 days, commits a one-line heartbeat
# (data/keepalive.json). Harmless: no secrets, no API calls, no spend, the
# site is unchanged. It shares weekly growth's concurrency group, so the two
# never push at the same time.

on:
  schedule:
    - cron: "17 4 * * 4"        # Thursdays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-grow
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Heartbeat if main has been quiet for 40 days
        run: python tools/grow/keepalive.py

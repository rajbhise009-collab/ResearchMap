name: Daily health

# Checks the live site once a day (tools/live-check.py + quick smoke checks).
# Opens or updates ONE Issue ("Daily health check failing") on failure and
# closes it when the checks pass again. No secrets; spends nothing.

on:
  schedule:
    - cron: "41 6 * * *"        # daily 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          npm install --no-save --prefix "$RUNNER_TEMP/axe" axe-core@4.13.0
          echo "AXE_PATH=$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"

      - name: Check the live site
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: python tools/grow/health.py

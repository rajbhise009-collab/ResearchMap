name: Weekly grow

# Adds new papers to the Diet & mortality and ML fairness libraries, two-phase:
# collect last week's Gemini batch, then submit this week's. Runbook:
# docs/OPERATIONS.md. Spend: capped by WEEKLY_BUDGET_INR (projection x1.5)
# and the lifetime ledger ceiling, both enforced in code before any call.
#
# Security: schedule + manual triggers only (never pull_request); actions
# pinned by commit SHA; secrets are passed only to the one step that needs
# them and are never echoed (tools/grow/run_weekly.py redacts every message).
#
# Pause growth: Actions tab → Weekly grow → ⋯ → Disable workflow.

on:
  schedule:
    - cron: "23 5 * * 1"        # Mondays 05:23 UTC (off the hour)
  workflow_dispatch:
    inputs:
      run_budget_inr:
        description: "Cap on TOTAL spend for this manual run, INR (enforced at call time)"
        required: false
        default: "25"
      build_queued:
        description: "Also build a queued library if the money rule allows it"
        type: boolean
        required: false
        default: false
      gates_only:
        description: "Zero-spend check: run preflight and every publish gate only (no API calls, nothing submitted or published)"
        type: boolean
        required: false
        default: false
      republish_branch:
        description: "Zero-spend republish of a failed run, e.g. grow/2026-10-10: regenerate on main, run every gate, publish only if all pass (no API calls, ledger untouched)"
        type: string
        required: false
        default: ""

permissions:
  contents: write     # commit to main, or push grow/<date> when a gate fails
  issues: write       # one Issue per run

# One run at a time, scheduled and manual alike (same group). A run in
# progress is NEVER cancelled (it may have submitted or collected paid
# batches); a newer trigger waits. Paid state is also pushed to main right
# after each paid step (run_weekly.checkpoint), so even a timeout loses nothing.
concurrency:
  group: weekly-grow
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (no secrets)
        id: install
        shell: bash
        run: |
          exec > >(tee "$RUNNER_TEMP/install.log") 2>&1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright==1.63.0
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend
          npm install --no-save --prefix "$RUNNER_TEMP/axe" axe-core@4.13.0
          echo "AXE_PATH=$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"

      - name: Grow, gate, publish
        id: grow
        shell: bash
        env:
          # gates_only and republish runs get no API keys at all (zero spend by construction)
          OPENALEX_API_KEY: ${{ inputs.gates_only != true && !inputs.republish_branch && secrets.OPENALEX_API_KEY || '' }}
          GEMINI_API_KEY: ${{ inputs.gates_only != true && !inputs.republish_branch && secrets.GEMINI_API_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
          # Manual runs: run_budget_inr caps total spend; build_queued (default
          # false) gates queued-library builds. Scheduled runs: the money rule.
          GROW_EVENT: ${{ github.event_name }}
          GROW_RUN_BUDGET_INR: ${{ inputs.run_budget_inr }}
          GROW_BUILD_QUEUED: ${{ inputs.build_queued }}
          GROW_GATES_ONLY: ${{ inputs.gates_only }}
          GROW_REPUBLISH: ${{ inputs.republish_branch }}
          WEEKLY_BUDGET_INR: ${{ vars.WEEKLY_BUDGET_INR }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          GROW_ISSUE_MARKER: ${{ runner.temp }}/grow-issue-written
        run: python tools/grow/run_weekly.py 2>&1 | tee "$RUNNER_TEMP/grow.log"

      # Any failure the run could not report itself (install failed, crash,
      # timeout, cancellation): open or update the run's ONE Issue with the
      # failing step and the last 60 lines. Spends nothing; changes no file.
      - name: Report a failure
        if: failure() || cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GROW_ISSUE_MARKER: ${{ runner.temp }}/grow-issue-written
          GROW_STEPS: ${{ toJSON(steps) }}
          GROW_EVENT: ${{ github.event_name }}
          GROW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/grow/on_failure.py "$RUNNER_TEMP/install.log" "$RUNNER_TEMP/grow.log"

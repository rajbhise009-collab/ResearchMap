name: CI

# Tests on every push to main and every pull request: no secrets, no API
# calls, nothing spent, read-only. Catches runner-only failures within
# minutes instead of at the next weekly run (which spends before its gates).
#   ledger append-only across the pushed commits · typecheck · production
#   build (+ consistency) · full tests in normal AND runner mode (fresh clone,
#   CI=1, regenerate, build, docs check) · Playwright smoke on that build
# Pushes made by the weekly workflow (GITHUB_TOKEN) do not trigger this.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true      # tests only: safe to cancel

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (no secrets)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright==1.63.0
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend
          npm install --no-save --prefix "$RUNNER_TEMP/axe" axe-core@4.13.0
          echo "AXE_PATH=$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"

      - name: Ledger is append-only
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python tools/ci/check_ledger.py "${BASE:-0000000000000000000000000000000000000000}" "$GITHUB_SHA"

      - name: Typecheck
        run: npx --prefix frontend tsc --noEmit -p frontend

      # the build first: rendered-output safety tests read it, and with CI=1
      # a safety test may not skip (backend/tests/conftest.py)
      - name: Production build (+ consistency before and after)
        run: npm run build --prefix frontend

      - name: Full tests, normal and runner mode
        run: PY=python tools/test.sh

      - name: Playwright smoke on the build
        shell: bash
        run: |
          python tools/qa/serve.py 8799 > /dev/null 2>&1 &
          SRV=$!
          trap 'kill $SRV' EXIT
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8799/ && break; sleep 1; done
          python tools/qa/smoke.py --engines=chromium http://127.0.0.1:8799

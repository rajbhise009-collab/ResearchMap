<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Warm paper gradient with a whisper of light from top-left -->
    <linearGradient id="bg" x1="0.15" y1="0.05" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fdfcf7"/>
      <stop offset="1" stop-color="#eae7dd"/>
    </linearGradient>
    <!-- Subtle inner glow behind the R for depth -->
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#3d5a58" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#3d5a58" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS-style squircle (rounded rectangle with generous radius). -->
  <rect x="112" y="112" width="800" height="800" rx="180" ry="180" fill="url(#bg)"/>
  <rect x="112" y="112" width="800" height="800" rx="180" ry="180" fill="url(#glow)"/>

  <!-- The mark. A serif "R" in deep teal — same family and colour token as
       the site's typography and accent. Rendered slightly optically
       shifted downward so it centres visually, not geometrically. -->
  <text x="512" y="758" text-anchor="middle"
        font-family="Charter, 'Iowan Old Style', Palatino, 'Palatino Linotype', Georgia, serif"
        font-size="680" font-weight="500" fill="#2f4a4e" letter-spacing="-0.015em">R</text>

  <!-- Bookmark-like accent under the R: signals "library / paper / index". -->
  <rect x="404" y="808" width="216" height="10" rx="5" fill="#2f4a4e" opacity="0.32"/>

  <!-- Thin edge stroke for definition at tiny sizes. Very low opacity so
       it doesn't read as a border, just as a lift off the paper. -->
  <rect x="112" y="112" width="800" height="800" rx="180" ry="180"
        fill="none" stroke="#1a1712" stroke-opacity="0.07" stroke-width="2"/>
</svg>
